# picom compositor config for MATE (X11) on Debian + NVIDIA.
# Adapted from the old i3 dotfiles; installed to ~/.config/picom/picom.conf
# by picom.nix. Marco's built-in compositor is disabled there.

# ===== BACKEND =====
backend = "glx";

# NVIDIA-specific: avoid tearing/flicker with the proprietary driver.
use-damage = false;          # Safer on NVIDIA; set true if performance is bad
xrender-sync-fence = true;   # Prevents frame sync issues on NVIDIA

# ===== SHADOWS =====
shadow = true;
shadow-radius = 14;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Mate-notification-daemon'",
    "class_g = 'flameshot'",
    "_GTK_FRAME_EXTENTS@"
];

# ===== FADING =====
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [
    "class_g = 'flameshot'"
];

# ===== BLUR =====
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
    "class_g = 'flameshot'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ===== ROUNDED CORNERS =====
corner-radius = 18;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'flameshot'",
    "class_g = 'Mate-panel'"
];

# ===== TRANSPARENCY / OPACITY =====
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Terminals (ghostty, kitty) get their transparency from their own configs;
# adding a rule here would stack on top of it.
opacity-rule = [
    "95:class_g = 'Code'",
    "100:class_g = 'flameshot'",
    "100:window_type = 'dialog'",
    "100:window_type = 'popup_menu'"
];

# ===== GENERAL =====
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
log-level = "warn";

# Window type rules
wintypes:
{
    tooltip       = { fade = true; shadow = false; opacity = 0.9; focus = true; };
    dock          = { shadow = false; clip-shadow-above = true; };
    dnd           = { shadow = false; };
    notification  = { shadow = false; };
    popup_menu    = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};
